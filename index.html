<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky77 Wheel</title>

<style>

body{
font-family:Arial;
background:#ffffff;
margin:0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:30px;
font-weight:bold;
color:#d6b25e;
}

.stats{
display:flex;
gap:20px;
margin-bottom:20px;
}

.stat{
background:#f5f5f5;
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
}

.wheel-wrap{
position:relative;
width:420px;
margin:auto;
}

canvas{
width:100%;
}

.spin{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:110px;
height:110px;
border-radius:50%;
background:#d6b25e;
border:none;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

.arrow{
position:absolute;
top:-15px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:12px solid transparent;
border-right:12px solid transparent;
border-bottom:20px solid #d6b25e;
}

.panel{
margin-top:30px;
}

.card{
border:1px solid #eee;
padding:12px;
margin-bottom:8px;
border-radius:8px;
}

button{
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">
<div class="logo">Lucky77 Wheel</div>
<button id="refreshBtn">Refresh</button>
</div>

<div class="stats">
<div class="stat">
Pool
<div id="poolCount">-</div>
</div>

<div class="stat">
Members
<div id="membersCount">-</div>
</div>

<div class="stat">
Winners
<div id="winnersCount">-</div>
</div>
</div>

<div class="wheel-wrap">

<div class="arrow"></div>

<canvas id="wheel" width="420" height="420"></canvas>

<button class="spin" id="spinBtn">
SPIN
</button>

</div>

<div class="panel">

<h3>Members</h3>
<div id="membersList"></div>

<h3>Winners</h3>
<div id="winnersList"></div>

<h3>History</h3>
<div id="historyList"></div>

</div>

</div>
<script>

const API_BASE="https://lucky77-wheel-bot.onrender.com"
const API_KEY="Lucky77_luckywheel_77"

function api(path,method="GET",body){

return fetch(API_BASE+path+"?key="+API_KEY,{
method,
headers:{
"Content-Type":"application/json",
"x-api-key":API_KEY
},
body:body?JSON.stringify(body):null
}).then(r=>r.json())

}

async function loadPool(){

const r=await api("/pool")

if(r.ok){
document.getElementById("poolCount").innerText=r.pool
}

}

async function loadMembers(){

const r=await api("/members")

if(!r.ok)return

document.getElementById("membersCount").innerText=r.total

let html=""

r.members.forEach(m=>{

html+=`
<div class="card">
${m.display}
</div>
`

})

document.getElementById("membersList").innerHTML=html

}

async function loadWinners(){

const r=await api("/winners")

if(!r.ok)return

document.getElementById("winnersCount").innerText=r.total

let html=""

r.winners.forEach(w=>{

html+=`
<div class="card">
#${w.turn} - ${w.prize} - ${w.display}
</div>
`

})

document.getElementById("winnersList").innerHTML=html

}

async function loadHistory(){

const r=await api("/history")

if(!r.ok)return

let html=""

r.history.forEach(h=>{

html+=`
<div class="card">
#${h.turn} - ${h.prize} - ${h.display}
</div>
`

})

document.getElementById("historyList").innerHTML=html

}

async function refreshAll(){

await loadPool()
await loadMembers()
await loadWinners()
await loadHistory()

}

document.getElementById("refreshBtn").onclick=refreshAll

</script>
<script>

const canvas=document.getElementById("wheel")
const ctx=canvas.getContext("2d")

let prizes=[]
let angle=0

function drawWheel(){

const total=prizes.length
const slice=2*Math.PI/total

ctx.clearRect(0,0,420,420)

for(let i=0;i<total;i++){

const start=angle+i*slice
const end=start+slice

ctx.beginPath()
ctx.moveTo(210,210)
ctx.arc(210,210,200,start,end)
ctx.fillStyle=i%2?"#f2f2f2":"#ffffff"
ctx.fill()

ctx.save()
ctx.translate(210,210)
ctx.rotate(start+slice/2)
ctx.fillStyle="#000"
ctx.textAlign="right"
ctx.fillText(prizes[i],180,0)
ctx.restore()

}

}

async function spin(){

const r=await api("/spin","POST")

if(!r.ok){
alert("Spin error")
return
}

const prize=r.prize

const index=prizes.indexOf(prize)

const slice=2*Math.PI/prizes.length

const target=-(index*slice)-(slice/2)+Math.PI/2

angle=target

drawWheel()

alert("Winner: "+r.winner.display+" | "+prize)

refreshAll()

}

document.getElementById("spinBtn").onclick=spin

async function init(){

const r=await api("/config")

if(r.prizes_source){

const lines=r.prizes_source.split("\n")

lines.forEach(l=>{

const p=l.split(" ")

if(p[0])prizes.push(p[0])

})

}

drawWheel()

refreshAll()

}

init()

</script>

</body>
</html>
