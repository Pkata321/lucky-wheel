<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
<script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky77 Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" loop></audio>

    <nav class="sidebar">
        <div class="logo">Lucky77</div>
        <button onclick="showPanel('dashboard')">Dashboard</button>
        <button onclick="openMembersPanel()">Members</button>
        <button onclick="openWinnersPanel()">Winners</button>
        <button onclick="openHistoryPanel()">History</button>
        <button class="danger" onclick="doReset()">Restart Spin</button>
    </nav>

    <main class="main-content">
        <header>
            <div class="header-titles">
                <h1>Lucky Wheel Event</h1>
                <p>Premium Event Dashboard</p>
            </div>
            <div class="header-actions">
                <button id="musicBtn" onclick="toggleMusic()">🔊 Music OFF</button>
                <button onclick="openDrawer()">⚙️ Settings</button>
            </div>
        </header>

        <div id="topBanner" class="banner">Welcome to Lucky77</div>

        <section id="dashboardPanel" class="panel active">
            <div class="stats-row">
                <div class="stat-card">Pool Count: <span id="poolCount">0</span></div>
                <div class="stat-card">Members: <span id="membersCount">0</span></div>
                <div class="stat-card">Winners: <span id="winnersCount">0</span></div>
                <div class="stat-card">
                    Test Mode: 
                    <input type="checkbox" id="testModeInput" onchange="toggleTestMode()">
                </div>
            </div>

            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="arrow">⬇</div>
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                    <button id="spinBtn" onclick="doSpin()">SPIN</button>
                </div>
                <div id="spinStatus" class="status-text">Ready</div>
            </div>

            <div class="prize-builder">
                <h3>Prize Builder</h3>
                <div id="prizeList"></div>
                <button onclick="addPrizeRow()">+ Add Prize</button>
                <button class="primary" onclick="syncPrizesToRender()">Save & Sync Wheel</button>
            </div>
        </section>

        <section id="membersPanel" class="panel">
            <div class="panel-header">
                <h2>Members <span id="membersTotal"></span></h2>
                <button onclick="showPanel('dashboard')">Close</button>
            </div>
            <div id="membersContent" class="list-container">Loading members...</div>
        </section>

        <section id="winnersPanel" class="panel">
            <div class="panel-header">
                <h2>Winners <span id="winnersTotal"></span></h2>
                <button onclick="showPanel('dashboard')">Close</button>
            </div>
            <div id="winnersContent" class="list-container">Loading winners...</div>
        </section>

        <section id="historyPanel" class="panel">
            <div class="panel-header">
                <h2>History <span id="historyTotal"></span></h2>
                <button onclick="exportHistoryPdfLike()">Export</button>
                <button onclick="showPanel('dashboard')">Close</button>
            </div>
            <div id="historyContent" class="list-container">Loading history...</div>
        </section>
    </main>

    <div id="settingsDrawer" class="drawer">
        <div class="drawer-content">
            <h2>Settings</h2>
            <label>API Key</label>
            <input type="text" id="settingApiKey" value="Lucky77_luckywheel_77">
            <label>Wheel Colors (comma separated)</label>
            <input type="text" id="settingColors" value="#FFD700,#FFFFFF,#F8F9FA,#E0E0E0">
            <div class="drawer-actions">
                <button onclick="closeDrawer()">Cancel</button>
                <button class="primary" onclick="saveSettings()">Save Apply</button>
            </div>
        </div>
    </div>

    <div id="winnerModal" class="modal">
        <div class="modal-content">
            <div class="badge">WINNER</div>
            <h2 id="modalPrize">Prize Name</h2>
            <h3 id="modalWinner">Winner Name</h3>
            <p id="modalHint">Congratulations!</p>
            <div id="modalActions"></div>
            <button onclick="hideWinnerModal()" class="close-btn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
