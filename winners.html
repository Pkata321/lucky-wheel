<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky77 CS Winners</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #f6f7fb;
      color: #111827;
    }

    .cs-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }

    .cs-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cs-title-wrap h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      color: #111827;
    }

    .cs-title-wrap p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .cs-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cs-card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.06);
    }

    .cs-stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .cs-stat {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.05);
    }

    .cs-stat span {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .cs-stat strong {
      font-size: 25px;
      font-weight: 900;
      color: #111827;
      word-break: break-word;
    }

    .cs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cs-search {
      flex: 1;
      min-width: 220px;
    }

    .cs-search input {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      color: #111827;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .cs-list {
      display: grid;
      gap: 12px;
    }

    .cs-item {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 16px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(16,24,40,0.04);
    }

    .cs-item.done-card {
      border-color: rgba(16,185,129,0.3);
      background: linear-gradient(180deg, #ffffff, #f0fdf4);
    }

    .cs-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .cs-item-title {
      font-size: 18px;
      font-weight: 900;
      color: #111827;
      margin-bottom: 4px;
    }

    .cs-item-sub {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .cs-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(0,0,0,0.08);
      background: #f8fafc;
      color: #334155;
    }

    .cs-badge.done {
      background: rgba(16,185,129,0.12);
      color: #047857;
      border-color: rgba(16,185,129,0.2);
    }

    .cs-badge.pending {
      background: rgba(245,158,11,0.12);
      color: #b45309;
      border-color: rgba(245,158,11,0.2);
    }

    .cs-badge.reply {
      background: rgba(59,130,246,0.12);
      color: #1d4ed8;
      border-color: rgba(59,130,246,0.2);
    }

    .winner-info-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .winner-info-title {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #111827;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 900;
      color: #4b5563;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 11px 12px;
      background: #fff;
      outline: none;
      font-size: 14px;
      color: #111827;
      box-sizing: border-box;
    }

    .field textarea {
      min-height: 88px;
      resize: vertical;
      line-height: 1.5;
    }

    .saved-preview {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px dashed rgba(0,0,0,0.14);
      color: #374151;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      background: #fff7ed;
      border: 1px solid rgba(251,146,60,0.25);
    }

    .message-box-title {
      font-size: 15px;
      font-weight: 900;
      color: #9a3412;
      margin-bottom: 10px;
    }

    .message-box textarea {
      width: 100%;
      min-height: 94px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      outline: none;
      resize: vertical;
      font-size: 14px;
      line-height: 1.5;
      box-sizing: border-box;
    }

    .cs-item-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .cs-btn,
    .cs-link-btn {
      min-height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cs-btn.primary,
    .cs-link-btn.primary {
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
    }

    .cs-btn.green {
      background: #10b981;
      color: #fff;
    }

    .cs-btn.orange {
      background: #f97316;
      color: #fff;
    }

    .cs-btn.dark {
      background: #111827;
      color: #fff;
    }

    .cs-btn.secondary,
    .cs-link-btn.secondary {
      background: #fff;
      color: #111827;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .cs-btn.danger {
      background: #ef4444;
      color: #fff;
    }

    .cs-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cs-empty {
      text-align: center;
      padding: 30px 14px;
      color: #6b7280;
    }

    .cs-footer-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 60;
      background: #111827;
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      max-width: calc(100vw - 28px);
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      z-index: 80;
    }

    .chat-modal {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(720px, calc(100vw - 24px));
      max-height: min(760px, calc(100vh - 36px));
      background: #fff;
      border-radius: 20px;
      z-index: 90;
      box-shadow: 0 24px 80px rgba(0,0,0,0.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-modal-head {
      padding: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .chat-modal-title {
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .chat-modal-sub {
      font-size: 13px;
      color: #6b7280;
    }

    .chat-close {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      cursor: pointer;
      font-weight: 900;
    }

    .chat-messages {
      padding: 16px;
      overflow: auto;
      display: grid;
      gap: 10px;
      background: #f8fafc;
    }

    .chat-row {
      display: flex;
    }

    .chat-row.outbound {
      justify-content: flex-end;
    }

    .chat-row.inbound {
      justify-content: flex-start;
    }

    .chat-bubble {
      max-width: 82%;
      border-radius: 16px;
      padding: 11px 12px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
    }

    .chat-row.outbound .chat-bubble {
      background: #dbeafe;
      border-color: rgba(59,130,246,0.18);
    }

    .chat-row.inbound .chat-bubble {
      background: #dcfce7;
      border-color: rgba(34,197,94,0.18);
    }

    .chat-meta {
      margin-top: 6px;
      font-size: 11px;
      color: #64748b;
      font-weight: 800;
    }

    @media (max-width: 900px) {
      .cs-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .cs-shell {
        padding: 14px;
      }

      .cs-stats {
        grid-template-columns: 1fr;
      }

      .input-grid {
        grid-template-columns: 1fr;
      }

      .cs-item-top {
        display: block;
      }

      .cs-actions,
      .cs-item-actions {
        width: 100%;
      }

      .cs-btn,
      .cs-link-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="cs-shell">
    <section class="cs-topbar">
      <div class="cs-title-wrap">
        <h1>Lucky77 CS Winners</h1>
        <p>Winner Game Account Info, Note, DM Message, Customer Reply History</p>
      </div>

      <div class="cs-actions">
        <button class="cs-btn secondary" id="refreshBtn">Refresh</button>
        <button class="cs-btn secondary" id="exportBtn">Export CSV</button>
      </div>
    </section>

    <section class="cs-stats">
      <div class="cs-stat">
        <span>Total Winners</span>
        <strong id="totalWinners">0</strong>
      </div>

      <div class="cs-stat">
        <span>Pending Winners</span>
        <strong id="pendingCount">0</strong>
      </div>

      <div class="cs-stat">
        <span>Done Winners</span>
        <strong id="doneCount">0</strong>
      </div>

      <div class="cs-stat">
        <span>Total Done Winner</span>
        <strong id="doneWinnerCount">0</strong>
      </div>

      <div class="cs-stat">
        <span>Total Done Amount</span>
        <strong id="doneAmount">0 Ks</strong>
      </div>
    </section>

    <section class="cs-card">
      <div class="cs-toolbar">
        <div class="cs-search">
          <input
            id="searchInput"
            type="search"
            placeholder="Search name / username / user id / prize / note / account..."
          />
        </div>
      </div>

      <div class="filter-row" id="filterRow"></div>

      <div class="cs-list" id="winnerList">
        <div class="cs-empty">Loading winners...</div>
      </div>

      <div style="margin-top: 14px; text-align: center;">
        <button class="cs-btn secondary hidden" id="loadMoreBtn">Load More</button>
      </div>

      <div class="cs-footer-note" id="footerText">—</div>
    </section>
  </main>

  <div class="toast hidden" id="toast"></div>

  <div class="modal-backdrop hidden" id="chatModalBackdrop"></div>

  <section class="chat-modal hidden" id="chatModal">
    <div class="chat-modal-head">
      <div>
        <div class="chat-modal-title" id="chatModalTitle">Customer Reply</div>
        <div class="chat-modal-sub" id="chatModalSub">—</div>
      </div>
      <button class="chat-close" id="chatModalClose">×</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>
  </section>

  <script src="winners.js?v=cs-note-done-amount-v1"></script>
</body>
</html>
