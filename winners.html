<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky77 CS Winners</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #f6f7fb;
    }

    .cs-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .cs-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cs-title-wrap h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .cs-title-wrap p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .cs-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cs-card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.06);
    }

    .cs-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .cs-stat {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.05);
    }

    .cs-stat span {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .cs-stat strong {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .cs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cs-search {
      flex: 1;
      min-width: 220px;
    }

    .cs-search input {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .cs-filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .cs-filter-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: #fff;
      color: #374151;
      font-weight: 700;
      cursor: pointer;
    }

    .cs-filter-btn.active {
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
      border-color: transparent;
    }

    .cs-list {
      display: grid;
      gap: 12px;
    }

    .cs-item {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
    }

    .cs-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .cs-item-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 4px;
    }

    .cs-item-sub {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .cs-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,0.08);
      background: #f8fafc;
      color: #334155;
    }

    .cs-badge.done {
      background: rgba(16,185,129,0.12);
      color: #047857;
      border-color: rgba(16,185,129,0.2);
    }

    .cs-badge.pending {
      background: rgba(245,158,11,0.12);
      color: #b45309;
      border-color: rgba(245,158,11,0.2);
    }

    .cs-badge.reply {
      background: rgba(59,130,246,0.12);
      color: #1d4ed8;
      border-color: rgba(59,130,246,0.2);
    }

    .cs-item-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .cs-btn,
    .cs-link-btn {
      min-height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .cs-btn.primary,
    .cs-link-btn.primary {
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
    }

    .cs-btn.secondary,
    .cs-link-btn.secondary {
      background: #fff;
      color: #111827;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .cs-link-btn.notice {
      background: #111827;
      color: #fff;
    }

    .cs-link-btn.danger {
      background: rgba(224,79,106,0.12);
      color: #be123c;
      border: 1px solid rgba(224,79,106,0.2);
    }

    .cs-empty {
      text-align: center;
      padding: 30px 14px;
      color: #6b7280;
    }

    .cs-footer-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }

    .cs-loadmore-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
      z-index: 9999;
    }

    .hidden {
      display: none !important;
    }

    button,
    .cs-link-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled,
    .cs-link-btn:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    button.is-loading,
    .cs-link-btn.is-loading {
      position: relative;
      pointer-events: none;
    }

    button.is-loading::after,
    .cs-link-btn.is-loading::after {
      content: "";
      width: 13px;
      height: 13px;
      margin-left: 8px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 999px;
      display: inline-block;
      vertical-align: -2px;
      animation: lucky77SpinMini 0.72s linear infinite;
    }

    @keyframes lucky77SpinMini {
      to { transform: rotate(360deg); }
    }

    /* ===== CS customer message box ===== */
    .cs-message-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid rgba(0,0,0,0.06);
      display: grid;
      gap: 10px;
    }

    .cs-message-title {
      font-size: 13px;
      color: #475569;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cs-message-textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      background: #fff;
      color: #111827;
      line-height: 1.55;
    }

    .cs-message-textarea:focus {
      border-color: rgba(123,92,255,0.5);
      box-shadow: 0 0 0 4px rgba(123,92,255,0.08);
    }

    .cs-last-line {
      margin-top: 8px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .cs-last-line strong {
      color: #111827;
    }

    /* ===== chat modal ===== */
    .cs-chat-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
    }

    .cs-chat-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .cs-chat-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(94vw, 680px);
      max-height: 86vh;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 22px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 28px 80px rgba(0,0,0,0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .cs-chat-head {
      padding: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .cs-chat-head h3 {
      margin: 0;
      font-size: 20px;
      color: #111827;
    }

    .cs-chat-head p {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .cs-chat-messages {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      gap: 10px;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
    }

    .cs-chat-row {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .cs-chat-row.inbound {
      justify-self: start;
      background: #f1f5f9;
      color: #111827;
      border-bottom-left-radius: 6px;
    }

    .cs-chat-row.outbound {
      justify-self: end;
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .cs-chat-meta {
      display: block;
      opacity: 0.78;
      font-size: 11px;
      margin-bottom: 5px;
      font-weight: 800;
    }

    .cs-chat-failed {
      display: block;
      margin-top: 6px;
      color: #ffe4e6;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 768px) {
      .cs-stats {
        grid-template-columns: 1fr;
      }

      .cs-item-top {
        flex-direction: column;
      }

      .cs-actions {
        width: 100%;
      }

      .cs-link-btn,
      .cs-btn {
        flex: 1 1 auto;
      }
    }

    @media (max-width: 640px) {
      .cs-shell {
        padding: 14px;
      }

      .cs-title-wrap h1 {
        font-size: 24px;
      }

      .cs-card {
        padding: 14px;
      }

      .cs-chat-panel {
        width: 96vw;
        max-height: 88vh;
      }

      .cs-chat-row {
        max-width: 94%;
      }

      .cs-chat-head {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="cs-shell">
    <div class="cs-topbar">
      <div class="cs-title-wrap">
        <h1>Lucky77 CS Winner List</h1>
        <p>Customer service use only · Winner notice, reply history, custom DM</p>
      </div>

      <div class="cs-actions">
        <a href="./index.html" class="cs-link-btn secondary">← Back to Main</a>
        <button id="refreshBtn" class="cs-btn primary" type="button">Refresh</button>
        <button id="exportBtn" class="cs-btn secondary" type="button">Export CSV</button>
      </div>
    </div>

    <div class="cs-stats">
      <div class="cs-stat">
        <span>Total Winners</span>
        <strong id="totalWinners">0</strong>
      </div>

      <div class="cs-stat">
        <span>Done</span>
        <strong id="doneCount">0</strong>
      </div>

      <div class="cs-stat">
        <span>Pending</span>
        <strong id="pendingCount">0</strong>
      </div>
    </div>

    <div class="cs-card">
      <div class="cs-toolbar">
        <div class="cs-search">
          <input id="searchInput" type="text" placeholder="Search name / username / id / prize / status" />
        </div>
      </div>

      <div class="cs-filter-row">
        <button class="cs-filter-btn active" data-filter="all" type="button">All</button>
        <button class="cs-filter-btn" data-filter="pending" type="button">Pending</button>
        <button class="cs-filter-btn" data-filter="done" type="button">Done</button>
        <button class="cs-filter-btn" data-filter="notice_pending" type="button">Notice Pending</button>
        <button class="cs-filter-btn" data-filter="notice_sent" type="button">Notice Sent</button>
        <button class="cs-filter-btn" data-filter="user_replied" type="button">User Replied</button>
      </div>

      <div id="winnerList" class="cs-list"></div>

      <div class="cs-loadmore-wrap">
        <button id="loadMoreBtn" class="cs-link-btn primary hidden" type="button">
          Load More
        </button>
      </div>

      <div class="cs-footer-note" id="footerText">Loading...</div>
    </div>
  </div>

  <!-- Customer Reply / Conversation Modal -->
  <div id="chatModal" class="cs-chat-modal hidden">
    <div id="chatModalBackdrop" class="cs-chat-backdrop"></div>

    <div class="cs-chat-panel">
      <div class="cs-chat-head">
        <div>
          <h3 id="chatModalTitle">Customer Reply</h3>
          <p id="chatModalSub">Conversation history</p>
        </div>

        <button id="chatModalClose" class="cs-btn secondary" type="button">Close</button>
      </div>

      <div id="chatMessages" class="cs-chat-messages">
        <div class="cs-empty">Loading...</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden">Ready</div>

  <script src="winners.js?v=cs-chat-v1"></script>
</body>
</html>
