<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky77 Winners</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary1: #7b5cff;
      --primary2: #18d2ff;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warn-bg: #fef3c7;
      --warn-text: #b45309;
      --pill-bg: #f3f4f6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(980px, calc(100vw - 24px));
      margin: 24px auto 48px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }

    .sub {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary1), var(--primary2));
      color: white;
    }

    .btn.gray {
      background: #e5e7eb;
      color: #111827;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .winner {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      background: #fff;
    }

    .winner-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .winner-name {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }

    .winner-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      background: var(--pill-bg);
      color: #111827;
    }

    .badge.success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .small-btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
    }

    .small-btn.notice {
      background: linear-gradient(135deg, var(--primary1), var(--primary2));
      color: white;
    }

    .small-btn.done {
      background: #ececec;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      background: #fff;
    }

    .loading {
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }

    .footer-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .winner-top {
        flex-direction: column;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 class="title">Lucky77 Winners</h1>
        <div class="sub">Customer service only winner list</div>
      </div>

      <div class="top-actions">
        <button id="openMainBtn" class="btn gray">Main UI</button>
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="searchInput" class="input" placeholder="Search winner / username / id / prize" />
        <button id="exportBtn" class="btn gray">Export CSV</button>
        <button id="reloadBtn" class="btn">Reload</button>
      </div>

      <div class="meta">
        <span id="countText">0 winners</span>
        <span id="updatedText">Updated: -</span>
      </div>

      <div id="list" class="list">
        <div class="loading">Loading winners...</div>
      </div>

      <div class="footer-note">
        Data source: <span id="baseUrlText"></span>/winners/cs
      </div>
    </div>
  </div>

  <script src="./winners.js"></script>
</body>
</html>
