<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky77 CS Winners</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #f6f7fb;
    }

    .hidden {
      display: none !important;
    }

    .admin-login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, rgba(24, 210, 255, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(123, 92, 255, 0.25), transparent 35%),
        #f6f7fb;
    }

    .admin-login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 26px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 24px 70px rgba(16, 24, 40, 0.16);
    }

    .admin-login-card h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 1000;
      color: #111827;
    }

    .admin-login-card p {
      margin: 8px 0 18px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .admin-login-card label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 900;
      color: #334155;
    }

    .admin-login-card input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    .admin-login-card input:focus {
      border-color: rgba(24, 210, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(24, 210, 255, 0.12);
    }

    .admin-login-card button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
      font-size: 15px;
      font-weight: 1000;
      cursor: pointer;
    }

    .admin-login-card button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .admin-login-error {
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      color: #dc2626;
    }

    .cs-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }

    .cs-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cs-title-wrap h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 1000;
      color: #111827;
    }

    .cs-title-wrap p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .cs-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cs-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
    }

    .cs-stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .cs-stat {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.05);
    }

    .cs-stat span {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .cs-stat strong {
      font-size: 25px;
      font-weight: 1000;
      color: #111827;
      word-break: break-word;
    }

    .cs-toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .cs-search input {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-btn {
      min-height: 38px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #fff;
      color: #111827;
      border-radius: 999px;
      padding: 0 13px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .cs-list {
      display: grid;
      gap: 12px;
    }

    .winner-card {
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.04);
    }

    .winner-card.done-card {
      opacity: 0.78;
      background: #f8fafc;
    }

    .winner-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .winner-title {
      font-size: 18px;
      font-weight: 1000;
      color: #111827;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .winner-sub {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .winner-prize {
      min-width: 150px;
      text-align: right;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 12px;
    }

    .winner-prize span {
      display: block;
      font-size: 12px;
      color: #64748b;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .winner-prize strong {
      display: block;
      font-size: 18px;
      color: #111827;
      font-weight: 1000;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #f8fafc;
      color: #334155;
    }

    .badge.done {
      background: rgba(16, 185, 129, 0.12);
      color: #047857;
      border-color: rgba(16, 185, 129, 0.2);
    }

    .badge.pending {
      background: rgba(245, 158, 11, 0.12);
      color: #b45309;
      border-color: rgba(245, 158, 11, 0.2);
    }

    .badge.reply {
      background: rgba(59, 130, 246, 0.12);
      color: #1d4ed8;
      border-color: rgba(59, 130, 246, 0.22);
    }

    .badge.info {
      background: rgba(139, 92, 246, 0.12);
      color: #6d28d9;
      border-color: rgba(139, 92, 246, 0.22);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .cs-btn,
    .cs-link-btn {
      min-height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cs-btn.primary,
    .cs-link-btn.primary {
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
    }

    .cs-btn.secondary,
    .cs-link-btn.secondary {
      background: #fff;
      color: #111827;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .cs-btn.green {
      background: #059669;
      color: #fff;
    }

    .cs-btn.orange {
      background: #f97316;
      color: #fff;
    }

    .cs-btn.dark {
      background: #111827;
      color: #fff;
    }

    .cs-btn.danger {
      background: #dc2626;
      color: #fff;
    }

    .cs-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .cs-empty {
      text-align: center;
      padding: 30px 14px;
      color: #6b7280;
    }

    .cs-footer-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      font-weight: 700;
    }

    .cs-loadmore-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #111827;
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      z-index: 9999;
      font-weight: 900;
      max-width: 320px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 8000;
    }

    .reply-modal {
      position: fixed;
      inset: 20px;
      max-width: 920px;
      margin: auto;
      background: #fff;
      border-radius: 22px;
      z-index: 9000;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 40px);
      overflow: hidden;
    }

    .reply-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background: #f8fafc;
    }

    .reply-modal-head h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 1000;
      color: #111827;
    }

    .reply-modal-head p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #64748b;
      font-weight: 800;
    }

    .reply-modal-close {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .reply-body {
      padding: 18px;
      overflow-y: auto;
      display: grid;
      gap: 14px;
    }

    .role-section {
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      padding: 14px;
      background: #fff;
    }

    .role-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 1000;
      color: #111827;
    }

    .role-tag {
      font-size: 12px;
      font-weight: 1000;
      color: #1d4ed8;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.18);
      border-radius: 999px;
      padding: 5px 9px;
      white-space: nowrap;
    }

    .saved-view {
      white-space: pre-wrap;
      background: #f8fafc;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
      font-weight: 700;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 1000;
      color: #475569;
    }

    .field input,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .chat-list {
      display: grid;
      gap: 10px;
    }

    .chat-row {
      display: flex;
    }

    .chat-row.inbound {
      justify-content: flex-start;
    }

    .chat-row.outbound {
      justify-content: flex-end;
    }

    .chat-bubble {
      max-width: 78%;
      border-radius: 16px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #f8fafc;
      color: #111827;
    }

    .chat-row.outbound .chat-bubble {
      background: #111827;
      color: #fff;
    }

    .chat-meta {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.75;
      font-weight: 800;
    }

    .inbox-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      margin-left: 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25);
    }

    .inbox-card {
      border-color: rgba(59, 130, 246, 0.28);
      background: linear-gradient(180deg, #ffffff, #f8fbff);
    }

    .inbox-card.unread {
      border-color: rgba(239, 68, 68, 0.34);
      background: linear-gradient(180deg, #ffffff, #fff7f7);
      box-shadow: 0 14px 34px rgba(239, 68, 68, 0.08);
    }

    .inbox-preview {
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .inbox-preview-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      flex-wrap: wrap;
    }

    .inbox-preview-role {
      font-size: 12px;
      font-weight: 1000;
      color: #1d4ed8;
    }

    .inbox-preview-time {
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
    }

    .inbox-preview-text {
      font-size: 14px;
      color: #111827;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inbox-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .inbox-meta-box {
      padding: 10px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .inbox-meta-box span {
      display: block;
      font-size: 11px;
      font-weight: 900;
      color: #64748b;
      margin-bottom: 4px;
    }

    .inbox-meta-box strong {
      display: block;
      font-size: 13px;
      font-weight: 1000;
      color: #111827;
      word-break: break-word;
    }

    .reply-modal-unread {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 1000;
      margin-left: 8px;
    }

    .role-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 920px) {
      .cs-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .inbox-meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .reply-modal {
        inset: 10px;
        max-height: calc(100vh - 20px);
      }
    }

    @media (max-width: 560px) {
      .cs-shell {
        padding: 14px;
      }

      .cs-stats {
        grid-template-columns: 1fr;
      }

      .winner-head {
        flex-direction: column;
      }

      .winner-prize {
        width: 100%;
        min-width: 0;
        text-align: left;
        box-sizing: border-box;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .inbox-meta-grid {
        grid-template-columns: 1fr;
      }

      .inbox-preview-text {
        white-space: normal;
      }

      .chat-bubble {
        max-width: 92%;
      }

      .cs-btn,
      .cs-link-btn {
        width: 100%;
      }

      .reply-modal-head {
        padding: 14px;
      }

      .reply-body {
        padding: 14px;
      }
    }
    
    .winner-card.unread {
  background: #eff6ff;
  border-left: 5px solid #2563eb;
  box-shadow: 0 12px 32px rgba(37, 99, 235, 0.14);
}

.winner-card.unread .winner-title {
  font-weight: 900;
  color: #0f172a;
}

.quick-menu-wrap {
  position: relative;
  display: flex;
  align-items: flex-start;
}

.quick-menu-btn {
  width: 36px;
  height: 36px;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  background: #fff;
  color: #111827;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
}

.quick-menu {
  position: absolute;
  top: 42px;
  right: 0;
  width: 190px;
  padding: 8px;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
  z-index: 30;
}

.quick-menu button {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: left;
  font-weight: 700;
  cursor: pointer;
}

.quick-menu button:hover {
  background: #f1f5f9;
}

.chat-section {
  display: flex;
  flex-direction: column;
  min-height: 520px;
  max-height: 72vh;
  overflow: hidden;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px 10px 18px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
}

.chat-row {
  display: flex;
  margin: 10px 0;
}

.chat-row.inbound {
  justify-content: flex-start;
}

.chat-row.outbound {
  justify-content: flex-end;
}

.chat-bubble {
  max-width: min(76%, 520px);
  padding: 12px 14px;
  border-radius: 18px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  color: #111827;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.chat-row.outbound .chat-bubble {
  background: #111827;
  color: #ffffff;
  border-color: #111827;
}

.chat-meta {
  margin-top: 8px;
  font-size: 11px;
  opacity: 0.7;
}

.chat-image {
  display: block;
  max-width: 260px;
  max-height: 260px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 8px;
  border: 1px solid rgba(148, 163, 184, 0.35);
}

.chat-text.muted {
  opacity: 0.7;
  font-size: 13px;
}

.chat-composer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 12px 0 0;
  background: #fff;
  z-index: 20;
}

.chat-input {
  flex: 1;
  min-height: 44px;
  max-height: 130px;
  resize: none;
  border: 1px solid #d1d5db;
  border-radius: 18px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.45;
  outline: none;
}

.chat-input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.composer-tool-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 999px;
  background: #f97316;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
}

.send-btn {
  min-width: 72px;
  height: 44px;
  border: 0;
  border-radius: 999px;
  background: #111827;
  color: #fff;
  font-weight: 900;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
    
  </style>
</head>

<body>
  <section id="adminLoginScreen" class="admin-login-screen">
    <div class="admin-login-card">
      <h1>Lucky77 CS Login</h1>
      <p>Admin Only Api Code ထည့်ပြီးမှ Winner CS Inbox ကိုဝင်လို့ရပါမယ်။</p>

      <label for="adminApiInput">Admin Only Api Code</label>
      <input
        id="adminApiInput"
        type="password"
        placeholder="Enter Admin Api Code"
        autocomplete="off"
      />

      <button id="adminLoginBtn" type="button">Login</button>
      <div id="adminLoginError" class="admin-login-error"></div>
    </div>
  </section>

  <main id="adminApp" class="cs-shell hidden">
    <div class="cs-topbar">
      <div class="cs-title-wrap">
        <h1>Lucky77 CS Winner List</h1>
