<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky77 CS Winners</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f6f7fb;
    }

    .cs-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .cs-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .cs-title-wrap h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .cs-title-wrap p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .cs-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cs-card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.06);
    }

    .cs-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .cs-stat {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.05);
    }

    .cs-stat span {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .cs-stat strong {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .cs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .cs-search {
      flex: 1;
      min-width: 220px;
    }

    .cs-search input {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .cs-list {
      display: grid;
      gap: 12px;
    }

    .cs-item {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
    }

    .cs-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .cs-item-title {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 4px;
    }

    .cs-item-sub {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .cs-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .cs-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,0.08);
      background: #f8fafc;
      color: #334155;
    }

    .cs-badge.done {
      background: rgba(16,185,129,0.12);
      color: #047857;
      border-color: rgba(16,185,129,0.2);
    }

    .cs-badge.pending {
      background: rgba(245,158,11,0.12);
      color: #b45309;
      border-color: rgba(245,158,11,0.2);
    }

    .cs-item-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .cs-btn,
    .cs-link-btn {
      height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cs-btn.primary,
    .cs-link-btn.primary {
      background: linear-gradient(135deg, #7b5cff, #18d2ff);
      color: #fff;
    }

    .cs-btn.secondary,
    .cs-link-btn.secondary {
      background: #fff;
      color: #111827;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .cs-empty {
      text-align: center;
      padding: 30px 14px;
      color: #6b7280;
    }

    .cs-footer-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }

    .cs-loadmore-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
      z-index: 9999;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 768px) {
      .cs-stats {
        grid-template-columns: 1fr;
      }

      .cs-item-top {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="cs-shell">
    <div class="cs-topbar">
      <div class="cs-title-wrap">
        <h1>Lucky77 CS Winner List</h1>
        <p>Customer service use only · Winner list only page</p>
      </div>

      <div class="cs-actions">
        <a href="./index.html" class="cs-link-btn secondary">← Back to Main</a>
        <button id="refreshBtn" class="cs-btn primary" type="button">Refresh</button>
        <button id="exportBtn" class="cs-btn secondary" type="button">Export CSV</button>
      </div>
    </div>

    <div class="cs-stats">
      <div class="cs-stat">
        <span>Total Winners</span>
        <strong id="totalWinners">0</strong>
      </div>
      <div class="cs-stat">
        <span>Done</span>
        <strong id="doneCount">0</strong>
      </div>
      <div class="cs-stat">
        <span>Pending</span>
        <strong id="pendingCount">0</strong>
      </div>
    </div>

    <div class="cs-card">
      <div class="cs-toolbar">
        <div class="cs-search">
          <input id="searchInput" type="text" placeholder="Search name / username / id / prize" />
        </div>
      </div>

      <div id="winnerList" class="cs-list"></div>

      <div class="cs-loadmore-wrap">
        <button id="loadMoreBtn" class="cs-link-btn primary hidden" type="button">
          Load More
        </button>
      </div>

      <div class="cs-footer-note" id="footerText">Loading...</div>
    </div>
  </div>

  <div id="toast" class="toast hidden">Ready</div>

  <script src="winners.js?v=fast274"></script>
</body>
</html>
